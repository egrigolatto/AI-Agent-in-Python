[project]
name = "ai-agent-in-python"
version = "0.2.0"
description = "Agente de IA local con herramientas, multi-proveedor (OpenRouter, Ollama y APIs compatibles con OpenAI) e interfaces CLI/TUI/Web."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.1.0",
    "pydantic-settings>=2.10",
    "textual>=8.2.8",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-agent = "ai_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
